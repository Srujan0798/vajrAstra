<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vajrAstra L2 · Human Review Console</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --line: #30363d;
  --fg: #e6edf3; --dim: #8b949e; --acc: #58a6ff; --good: #3fb950;
  --shaky: #d29922; --bad: #f85149; --gt: #a371f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg);
  font: 14px/1.45 -apple-system, "Noto Sans Telugu", "Noto Sans Tamil",
  "Noto Sans Kannada", "Noto Sans Malayalam", "Noto Sans Devanagari",
  BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100vh; overflow: hidden; }
header { display: flex; align-items: baseline; gap: 14px; padding: 10px 18px;
  border-bottom: 1px solid var(--line); background: var(--panel); flex: 0 0 auto; }
header h1 { font-size: 16px; letter-spacing: .3px; }
header h1 b { color: var(--acc); }
header .sub { color: var(--dim); font-size: 12px; }
#export { margin-left: auto; background: #21262d; color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px;
  font-size: 12px; cursor: pointer; }
#export:hover { border-color: var(--acc); }
.wrap { display: flex; height: calc(100vh - 92px); }
aside { width: 260px; flex: 0 0 260px; overflow-y: auto; border-right: 1px solid var(--line); }
aside .pg { display: block; width: 100%; text-align: left; background: none;
  border: 0; border-bottom: 1px solid var(--line); color: var(--fg);
  padding: 9px 12px; cursor: pointer; font-size: 12.5px; }
aside .pg:hover { background: var(--panel2); }
aside .pg.on { background: var(--panel2); box-shadow: inset 3px 0 0 var(--acc); }
aside .pg .pid { font-weight: 600; }
aside .pg .meta { color: var(--dim); font-size: 11px; margin-top: 2px;
  display: flex; gap: 8px; }
aside .pg .done { color: var(--good); }
main { flex: 1 1 auto; overflow-y: auto; padding: 16px 22px 60px; }
.pghead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
.pghead h2 { font-size: 18px; }
.tag { font-size: 11px; border: 1px solid var(--line); border-radius: 10px;
  padding: 2px 9px; color: var(--dim); }
.tag.warn { color: var(--shaky); border-color: var(--shaky); }
.tag.gt-thin { color: var(--bad); border-color: var(--bad); }
.pghead img { height: 46px; border: 1px solid var(--line); border-radius: 3px;
  margin-left: auto; cursor: zoom-in; }
.verdictbar { display: flex; gap: 10px; align-items: center;
  padding: 9px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.verdictbar .lbl { color: var(--dim); font-size: 12px; }
.vbtn { border: 1px solid var(--line); background: #21262d; color: var(--fg);
  border-radius: 6px; padding: 5px 16px; font-size: 12.5px; cursor: pointer; }
.vbtn.good.on { background: color-mix(in srgb, var(--good) 30%, #0d1117); border-color: var(--good); }
.vbtn.shaky.on { background: color-mix(in srgb, var(--shaky) 30%, #0d1117); border-color: var(--shaky); }
.vbtn.bad.on { background: color-mix(in srgb, var(--bad) 30%, #0d1117); border-color: var(--bad); }
.vbtn:hover { border-color: var(--acc); }
.note { flex: 1; background: #0b0f14; border: 1px solid var(--line);
  color: var(--fg); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; }
.gtb { border: 1px solid var(--gt); border-left: 4px solid var(--gt);
  background: color-mix(in srgb, var(--gt) 7%, var(--panel));
  border-radius: 6px; padding: 10px 14px; margin-bottom: 16px; white-space: pre-wrap; }
.gtb h3 { color: var(--gt); font-size: 11.5px; letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 6px; }
.gtb .trunc { color: var(--dim); font-size: 11px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
.card.on-good { border-color: var(--good); }
.card.on-shaky { border-color: var(--shaky); }
.card.on-bad { border-color: var(--bad); }
.card .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card .nm { font-weight: 650; font-size: 12.5px; }
.card .hd .right { margin-left: auto; display: flex; gap: 6px; }
.cer { font-size: 10.5px; border-radius: 9px; padding: 1px 7px;
  border: 1px solid var(--line); color: var(--dim); }
.cer.g { color: var(--good); border-color: var(--good); }
.cer.w { color: var(--shaky); border-color: var(--shaky); }
.cer.b { color: var(--bad); border-color: var(--bad); }
.cer.n { color: var(--dim); }
.ch { font-size: 10.5px; color: var(--dim); }
.card pre { white-space: pre-wrap; font-size: 12px; line-height: 1.5;
  font-family: inherit; max-height: 170px; overflow: hidden;
  color: var(--fg); opacity: .92; background: #0b0f14; border-radius: 5px; padding: 8px; }
.card .ev { display: flex; gap: 6px; }
.card .ev button { flex: 1; font-size: 11px; padding: 3px 0;
  border-radius: 5px; border: 1px solid var(--line); background: #21262d;
  color: var(--dim); cursor: pointer; }
.card .ev .b-g.on { color: var(--good); border-color: var(--good); background: rgba(63,185,80,.15); }
.card .ev .b-s.on { color: var(--shaky); border-color: var(--shaky); background: rgba(210,153,34,.15); }
.card .ev .b-b.on { color: var(--bad); border-color: var(--bad); background: rgba(248,81,73,.15); }
.minibtns { display: flex; gap: 4px; }
.minibtns button { background: #21262d; color: var(--dim); border: 1px solid var(--line);
  border-radius: 10px; font-size: 11px; padding: 2px 8px; cursor: pointer; }
.minibtns button.on { color: var(--acc); border-color: var(--acc); }
footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
  border-top: 1px solid var(--line); color: var(--dim); font-size: 11px;
  padding: 4px 18px; display: flex; gap: 14px; }
footer b { color: var(--fg); }
#toast { position: fixed; bottom: 42px; right: 20px; background: var(--good);
  color: #0d1117; font-weight: 600; border-radius: 6px; padding: 8px 16px;
  opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 10; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none;
  align-items: center; justify-content: center; z-index: 20; cursor: zoom-out; }
#zoom img { max-width: 92vw; max-height: 92vh; border: 1px solid var(--line); }
</style>
</head>

      b.addEventListener("click", () => {
        verdicts[pid].engines = verdicts[pid].engines || {};
        const k = b.className.includes("b-g") ? "good"
          : b.className.includes("b-s") ? "shaky" : "bad";
        verdicts[pid].engines[e] = verdicts[pid].engines[e] === k ? null : k;
        save(); render(); renderList();
      }));
  });
  $("#thumb").addEventListener("click", () => {
    $("#zoomimg").src = p.png; $("#zoom").style.display = "flex";
  });
}

$("#zoom").addEventListener("click", () => { $("#zoom").style.display = "none"; });

$("#export").addEventListener("click", async () => {
  const out = { exported_at: new Date().toISOString(), bundle_generated_at: B.generated_at,
    verdicts: verdicts, done: PAGES.filter(pageDone).length, total: PAGES.length };
  const s = JSON.stringify(out, null, 2);
  try { await navigator.clipboard.writeText(s); }
  catch (e) { const t = document.createElement("textarea");
    t.value = s; document.body.appendChild(t); t.select();
    document.execCommand("copy"); t.remove(); }
  const toast = $("#toast"); toast.style.opacity = 1;
  setTimeout(() => { toast.style.opacity = 0; }, 1200);
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowDown" || e.key === "j") { cur = Math.min(cur + 1, PAGES.length - 1); render(); renderList(); }
  if (e.key === "ArrowUp" || e.key === "k") { cur = Math.max(cur - 1, 0); render(); renderList(); }
});

(function init() {
  const s = B.stats;
  $("#hsub").textContent =
    `${PAGES.length} top-disagreement pages · ${ORDER.length} engines · sorted by char-count spread`;
  const done = PAGES.filter(pageDone).length;
  $("#foot").innerHTML =
    `<span><b>${PAGES.length}</b> pages</span>` +
    `<span>layered <b>${s.n_layered_available}</b> available</span>` +
    `<span>thin <b>${s.n_thin_picked}</b> picked</span>` +
    `<span>mixed <b>${s.n_mixed}</b></span>` +
    `<span>reviewed <b>${done}/${PAGES.length}</b></span>` +
    `<span>source: ${esc(s.selection_source)}</span>` +
    `<span>bundle ${esc(B.generated_at)}</span>`;
  renderList(); render();
})();
</script>
</body>
</html>
